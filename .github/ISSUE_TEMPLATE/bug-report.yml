name: Bug report
description: Something in the skill or its scripts doesn't work as documented.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check [docs/troubleshooting.md](https://github.com/endgame302/video-notes/blob/main/docs/troubleshooting.md) first.
        For a security problem, use [private reporting](https://github.com/endgame302/video-notes/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or request, and its output
      description: The exact command (or what you asked the agent), and the error. Paste text, not screenshots.
      render: text
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - frames.py (screenshot capture)
        - cloud_frames.py (Kaggle)
        - check_deps.py
        - SKILL.md (what the agent does)
        - Installation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From `metadata.version` in SKILL.md, or the commit.
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Agent and OS
      placeholder: "Claude Code 2.1.3xx on Windows 11; Python 3.13"
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: frames.json details (if frames.py was involved)
      description: The `warnings`, `counts`, `secs` and `ocr` fields from the manifest.
      render: json
  - type: input
    id: video
    attributes:
      label: Video
      description: A public URL that shows the problem, if you can share one.
