name: Feature request
description: Suggest an improvement to the notes, the scripts or the docs.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What's hard or missing today? A concrete video or situation helps.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. Alternatives you considered are welcome too.
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - The notes page (content, visuals, quiz)
        - Screenshot capture (frames.py)
        - Cloud runs (cloud_frames.py)
        - Installation or agent support
        - Docs
        - Other
    validations:
      required: true
