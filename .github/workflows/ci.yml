name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python .github/scripts/check_repo.py

  smoke:
    name: frames.py smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-eng
      - name: Install ffmpeg and Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg tesseract
      - name: Install ffmpeg and Tesseract (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg tesseract -y --no-progress

      - name: Install Python packages
        run: python -m pip install -r skills/video-notes/requirements.txt yt-dlp

      - name: check_deps.py
        run: python skills/video-notes/scripts/check_deps.py

      - name: Make a 20-second 1080p test video
        run: ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=size=1920x1080:rate=30:duration=20" -pix_fmt yuv420p -c:v libx264 test.mp4

      - name: frames.py
        run: python skills/video-notes/scripts/frames.py test.mp4 --out out

      - name: Check the manifest
        shell: python
        run: |
          import json, pathlib
          m = json.loads(pathlib.Path("out/frames.json").read_text(encoding="utf-8"))
          assert m["sampled"] >= 19, m["sampled"]
          assert sum(m["counts"].values()) == m["sampled"], m["counts"]
          assert m["kept"] and all(pathlib.Path("out", k["file"]).is_file() for k in m["kept"])
          print("ok:", m["sampled"], "frames sampled,", len(m["kept"]), "kept,", m["counts"], m["warnings"])
